name: Linux CI

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate benchmark harnesses
        run: |
          python3 -m py_compile \
            tools/stress_http.py \
            tools/compare_runtimes.py \
            tools/analyze_runtime_pairs.py \
            tools/validate_m6b2_campaign.py
          python3 tools/stress_http.py --help >/dev/null
          python3 tools/compare_runtimes.py --help >/dev/null
          python3 tools/analyze_runtime_pairs.py --help >/dev/null
          python3 tools/validate_m6b2_campaign.py --help >/dev/null
          bash -n scripts/capture_benchmark_environment.sh scripts/run_m6b2_campaign.sh
          (cd tools && python3 -m unittest -v test_analyze_runtime_pairs.py test_validate_m6b2_campaign.py)
      - name: Configure GCC
        if: matrix.compiler == 'gcc'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++
      - name: Configure Clang
        if: matrix.compiler == 'clang'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Runtime comparison smoke (not benchmark evidence)
        if: matrix.compiler == 'gcc'
        run: |
          python3 tools/compare_runtimes.py \
            --server ./build/vhttp_bench_server \
            --output-dir build/benchmark-smoke \
            --runtimes threadpool,epoll \
            --runs 1 \
            --admission 16 \
            --workers 2 \
            --payload 32 \
            --requests 40 \
            --concurrency 2 \
            --warmup 4 \
            --mode keepalive \
            --startup-timeout 5 \
            --client-phase-timeout 30 \
            --shutdown-timeout 5 \
            --require-identified-build
          python3 tools/analyze_runtime_pairs.py build/benchmark-smoke \
            --output build/benchmark-smoke/paired-analysis.json
