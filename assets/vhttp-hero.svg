<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d">
<title id="t">vhttp — C++20 HTTP/1.1 Server From Scratch</title>
<desc id="d">A cross platform C++20 HTTP server built from raw sockets with incremental parsing, routing, secure static files, bounded thread pool concurrency, Linux epoll, and reproducible comparative benchmark tooling.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4F0E8"/><stop offset="1" stop-color="#E5EDF1"/></linearGradient><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#6F90A8" stroke-opacity=".09"/></pattern><filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#132436" flood-opacity=".10"/></filter></defs>
<rect width="1200" height="430" rx="28" fill="url(#bg)"/><rect width="1200" height="430" rx="28" fill="url(#grid)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
<text x="58" y="62" font-size="15" font-weight="700" letter-spacing="3.2" fill="#647985">C++20 · RAW SOCKETS · HTTP/1.1 · THREAD POOL · EPOLL</text>
<text x="58" y="119" font-size="49" font-weight="800" fill="#132436">vhttp</text>
<text x="58" y="155" font-size="22" font-weight="650" fill="#395260">HTTP/1.1 server built from scratch</text>
<text x="58" y="210" font-size="18.5" fill="#425866">Explicit parsing, framing, routing, secure static files, persistence,</text>
<text x="58" y="238" font-size="18.5" fill="#425866">bounded concurrency, event driven I/O, and reproducible benchmarking.</text>
